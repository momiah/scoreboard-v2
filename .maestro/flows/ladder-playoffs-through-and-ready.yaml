appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/journey-advance.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "r16-leg2-win"
      TIE: "r1-s1"
      CARD: "playoff-match-leg2"
      MATCH: "r1-s1-leg2"
      GAME: "g6"
      NOTIFICATION: ".*You're through to the Quarter-Final in Maestro Playoffs 256.*"
- tapOn: ".*You're through to the Quarter-Final in Maestro Playoffs 256.*"
- extendedWaitUntil:
    visible:
      id: "playoff-match-details"
    timeout: 40000
- assertVisible: ".*Quarter-Final · Tie.*"
- assertVisible: ".*Arranged once both players are known.*"
- runFlow:
    file: ../utilities/playoffs/journey-companion.yaml
    env:
      SUFFIX: ""
      NOTIFICATION: ".*Your Quarter-Final against .* is ready! You have ${MAESTRO_PLAYOFF_TIE_DAYS} days to complete both matches.*"
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-assert-po-companion-winner-through"
- runFlow: ../utilities/playoffs/open-notifications.yaml
- extendedWaitUntil:
    visible: ".*Your Quarter-Final against .* is ready! You have ${MAESTRO_PLAYOFF_TIE_DAYS} days to complete both matches.*"
    timeout: 30000
- tapOn: ".*Your Quarter-Final against .* is ready! You have ${MAESTRO_PLAYOFF_TIE_DAYS} days to complete both matches.*"
- extendedWaitUntil:
    visible:
      id: "playoff-match-details"
    timeout: 40000
- assertVisible: ".*Quarter-Final · Tie.*"
- assertVisible:
    id: "playoff-match-leg1-host"
- assertNotVisible: ".*Arranged once both players are known.*"
