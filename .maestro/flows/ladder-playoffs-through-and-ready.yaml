appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/journey-advance.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "r16-leg2-win"
      TIE: "r1-s1"
      CARD: "playoff-match-leg2"
      MATCH: "r1-s1-leg2"
      GAME: "g6"
      NOTIFICATION: ".*You're through to the Quarter-Final in Maestro Playoffs 256.*"
- tapOn: ".*You're through to the Quarter-Final in Maestro Playoffs 256.*"
- extendedWaitUntil:
    visible:
      id: "ladder-playoffs-bracket"
    timeout: 40000
- waitForAnimationToEnd
- runFlow:
    file: ../utilities/playoffs/open-bracket-tie.yaml
    env:
      TIE: "r2-s0"
      SCROLL: "no"
- assertVisible: ".*Quarter-Final · Tie.*"
- assertVisible: ".*Arranged once both players are known.*"
- runFlow:
    file: ../utilities/playoffs/journey-companion.yaml
    env:
      SUFFIX: ""
      NOTIFICATION: ".*Your opponent in the Quarter-Final of Maestro Playoffs 256 is.*Your tie is ready.*"
- tapOn: ".*Your opponent in the Quarter-Final of Maestro Playoffs 256 is.*Your tie is ready.*"
- extendedWaitUntil:
    visible:
      id: "ladder-playoffs-bracket"
    timeout: 40000
- waitForAnimationToEnd
- runFlow:
    file: ../utilities/playoffs/open-bracket-tie.yaml
    env:
      TIE: "r2-s0"
      SCROLL: "no"
- assertVisible: ".*Quarter-Final · Tie.*"
- assertVisible:
    id: "playoff-match-leg1-host"
- assertNotVisible: ".*Arranged once both players are known.*"
