appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-cancel-accepted"
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-mock-checkin-opponent-scans-user-delayed"
- setLocation:
    latitude: 51.5
    longitude: -0.12
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Cancel Ladder on Schedule.*"
    timeout: 15000
- tapOn: ".*open Maestro Cancel Ladder on Schedule.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-cancel-match"
    timeout: 20000
- tapOn:
    id: "schedule-card-maestro-cancel-match"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*Press here to checkin.*"
    timeout: 15000
- tapOn:
    point: "78%,23%"
- extendedWaitUntil:
    visible:
      id: "location-verifier-verified"
    timeout: 30000
- tapOn:
    id: "location-verifier-checkin"
- extendedWaitUntil:
    visible:
      id: "match-checkin-modal"
    timeout: 15000
- assertVisible:
    id: "match-checkin-waiting"
- assertVisible: ".*-MATCH.*"
- extendedWaitUntil:
    visible:
      id: "match-checkin-success"
    timeout: 90000
