appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-ladder-playoffs-generated-256"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 300000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Playoffs 256 on Summary.*"
    timeout: 20000
- tapOn: ".*open Maestro Playoffs 256 on Summary.*"
- extendedWaitUntil:
    visible:
      id: "ladder-summary"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "ladder-status"
    timeout: 30000
- assertVisible:
    id: "ladder-status"
    text: "Playoffs"
- assertVisible: "Status"
- assertNotVisible:
    id: "ladder-playoff-countdown"
- assertNotVisible: "To Playoffs"
