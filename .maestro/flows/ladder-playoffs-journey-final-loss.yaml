appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "final-leg2-loss"
      TIE: "r4-s0"
      MATCH: "r4-s0-leg2"
      PLACED: ".*you have placed 2nd in Maestro Playoffs 256 and been awarded 2,560 CP\\..*"
      OPPONENT: "opponent-placed-1st"
      COMPANION_WINNER: "companion-winner-placed-3rd"
      COMPANION_LOSER: "companion-loser-placed-4th"
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      SEED: "final-leg2-loss"
      TIE: "r4-s0"
      MATCH: "r4-s0-leg2"
      PLACED: ".*you have placed 2nd in Maestro Playoffs 256 \\(Paid\\) and been awarded £1024 and 2,560 CP\\..*"
      OPPONENT: "opponent-placed-1st"
      COMPANION_WINNER: "companion-winner-placed-3rd"
      COMPANION_LOSER: "companion-loser-placed-4th"
