appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: ""
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "final-leg2-win"
      TIE: "r4-s0"
      MATCH: "r4-s0-leg2"
      PLACED: ".*${output.finished1}.*"
      OPPONENT: "opponent-placed-2nd"
      COMPANION_WINNER: "companion-winner-placed-3rd"
      COMPANION_LOSER: "companion-loser-placed-4th"
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: "-paid"
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      SEED: "final-leg2-win"
      TIE: "r4-s0"
      MATCH: "r4-s0-leg2"
      PLACED: ".*${output.finished1}.*"
      OPPONENT: "opponent-placed-2nd"
      COMPANION_WINNER: "companion-winner-placed-3rd"
      COMPANION_LOSER: "companion-loser-placed-4th"
