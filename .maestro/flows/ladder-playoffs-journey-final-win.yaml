appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "final-leg2-win"
      TIE: "r4-s0"
      MATCH: "r4-s0-leg2"
      PLACED: ".*you have placed 1st in Maestro Playoffs 256 and been awarded 4,480 CP\\..*"
      OPPONENT: "opponent-placed-2nd"
      COMPANION_WINNER: "companion-winner-placed-3rd"
      COMPANION_LOSER: "companion-loser-placed-4th"
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      SEED: "final-leg2-win"
      TIE: "r4-s0"
      MATCH: "r4-s0-leg2"
      PLACED: ".*you have placed 1st in Maestro Playoffs 256 \\(Paid\\) and been awarded £1793 and 4,480 CP\\..*"
      OPPONENT: "opponent-placed-2nd"
      COMPANION_WINNER: "companion-winner-placed-3rd"
      COMPANION_LOSER: "companion-loser-placed-4th"
