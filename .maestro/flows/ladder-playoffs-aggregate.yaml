appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-playoff-match-leg1Complete"
- runFlow:
    file: ../utilities/playoffs/open-playoffs-tab.yaml
    env:
      NOTIFICATION: ".*open Maestro Playoffs 256 on Playoffs.*"
- runFlow:
    file: ../utilities/playoffs/open-bracket-tie.yaml
    env:
      TIE: "r1-s1"
      SCROLL: "no"
- assertVisible:
    id: "playoff-match-aggregate"
- assertVisible: "4 - 2"
- assertVisible: ".*Aggregate.*|.*AGGREGATE.*"
