appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/journey-advance.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "sf-leg2-win"
      TIE: "r3-s0"
      CARD: "playoff-match-leg2"
      MATCH: "r3-s0-leg2"
      GAME: "g6"
      NOTIFICATION: ".*You're through to the Final in Maestro Playoffs 256.*"
- runFlow:
    file: ../utilities/playoffs/journey-companion.yaml
    env:
      SUFFIX: ""
      NOTIFICATION: ".*Your Final against .* is ready! You have ${MAESTRO_PLAYOFF_TIE_DAYS} days to complete both matches.*"
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-assert-po-companion-winner-through"
- runFlow:
    file: ../utilities/playoffs/journey-advance.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      SEED: "sf-leg2-win"
      TIE: "r3-s0"
      CARD: "playoff-match-leg2"
      MATCH: "r3-s0-leg2"
      GAME: "g6"
      NOTIFICATION: ".*You're through to the Final in Maestro Playoffs 256 \\(Paid\\).*"
- runFlow:
    file: ../utilities/playoffs/journey-companion.yaml
    env:
      SUFFIX: "-paid"
      NOTIFICATION: ".*Your Final against .* is ready! You have ${MAESTRO_PLAYOFF_TIE_DAYS} days to complete both matches.*"
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-assert-po-paid-companion-winner-through"
