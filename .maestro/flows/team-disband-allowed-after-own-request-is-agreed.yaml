appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-disband-accepted-match"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 30000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Disband Ladder on Schedule.*"
    timeout: 15000
- tapOn: ".*open Maestro Disband Ladder on Schedule.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-disband-match"
    timeout: 20000
- tapOn:
    id: "schedule-card-maestro-disband-match"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- tapOn:
    id: "match-details-burger"
- tapOn:
    id: "match-menu-CancelMatch"
- extendedWaitUntil:
    visible: "Send Request"
    timeout: 5000
- tapOn: "Send Request"
- extendedWaitUntil:
    visible: "Cancellation request sent"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "match-cancellation-awaiting"
    timeout: 15000
- tapOn:
    id: "tab-home"
- tapOn:
    id: "maestro-mock-disband-opponent-accept"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 15000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- tapOn: ".*open Maestro Disband Ladder on Summary.*"
- scrollUntilVisible:
    element:
      id: "ladder-team-summary"
    direction: DOWN
- tapOn:
    id: "ladder-team-summary"
- extendedWaitUntil:
    visible:
      id: "team-details-screen"
    timeout: 15000
- tapOn:
    id: "team-details-menu"
- scrollUntilVisible:
    element:
      id: "team-settings-disband"
    direction: DOWN
- tapOn:
    id: "team-settings-disband"
- extendedWaitUntil:
    visible: "Disband team"
    timeout: 5000
- tapOn: "Disband"
- extendedWaitUntil:
    visible: "Team disbanded"
    timeout: 20000
- assertNotVisible:
    id: "ladder-team-summary"
