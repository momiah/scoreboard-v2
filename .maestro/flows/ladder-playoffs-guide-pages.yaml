appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: ""
- runFlow:
    file: ../utilities/playoffs/guide-pages.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      FOOTNOTE: ".*Current ladder size: 256 / 256 with a CP prize pool of ${output.cpPool} CP.*"
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: "-paid"
- runFlow:
    file: ../utilities/playoffs/guide-pages.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      FOOTNOTE: ".*Current ladder size: 256 / 256 with a total cash prize pool of ${output.cashPool} and a CP prize pool of ${output.cpPool} CP.*"
