appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-cancel-game-reported"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 60000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Cancel Ladder on Schedule.*"
    timeout: 15000
- tapOn: ".*open Maestro Cancel Ladder on Schedule.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-cancel-match"
    timeout: 20000
- tapOn:
    id: "schedule-card-maestro-cancel-match"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- tapOn:
    id: "match-details-burger"
- tapOn:
    id: "match-menu-CancelMatch"
- extendedWaitUntil:
    visible: "This match can no longer be cancelled"
    timeout: 10000
- assertNotVisible: "Send Request"
