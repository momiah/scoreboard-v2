appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/journey-advance.yaml
    env:
      SUFFIX: "-doubles"
      LADDER: "Maestro Playoffs Doubles 256"
      SEED: "r16-leg2-win"
      TIE: "r1-s1"
      CARD: "playoff-match-leg2"
      MATCH: "r1-s1-leg2"
      GAME: "g6"
      NOTIFICATION: ".*You're through to the Quarter-Final in Maestro Playoffs Doubles 256.*"
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-assert-po-doubles-partner-through-to-the-quarter-final"
- runFlow:
    file: ../utilities/playoffs/journey-companion.yaml
    env:
      SUFFIX: "-doubles"
      NOTIFICATION: ".*Your Quarter-Final against .* is ready! You have ${MAESTRO_PLAYOFF_TIE_DAYS} days to complete both matches.*"
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-assert-po-doubles-companion-winner-through"
