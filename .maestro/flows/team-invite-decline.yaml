appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-team-invited"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 60000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*invited you to form a doubles team.*"
    timeout: 15000
- tapOn: ".*invited you to form a doubles team.*"
- extendedWaitUntil:
    visible:
      id: "invite-action-modal"
    timeout: 15000
- tapOn:
    id: "invite-action-decline"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible:
    id: "invite-action-modal"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Team Ladder on Summary.*"
    timeout: 15000
- tapOn: ".*open Maestro Team Ladder on Summary.*"
- scrollUntilVisible:
    element:
      id: "ladder-summary-join"
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "ladder-summary-join"
- runFlow:
    when:
      notVisible: "Select Team"
    commands:
      - tapOn:
          id: "ladder-summary-join"
- extendedWaitUntil:
    visible: "Select Team"
    timeout: 15000
- assertNotVisible: ".*Maestro Invited Team.*"
