appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-cancel-overdue-opponent-arrived"
- runFlow:
    when:
      platform: iOS
    commands:
      - setLocation:
          latitude: 51.5
          longitude: -0.12
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Cancel Ladder on Schedule.*"
    timeout: 15000
- tapOn: ".*open Maestro Cancel Ladder on Schedule.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-cancel-match"
    timeout: 20000
- tapOn:
    id: "schedule-card-maestro-cancel-match"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*Press here to checkin.*"
    timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "78%,25%"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: ".*Press here to checkin.*"
      - tapOn:
          text: "Turn on"
          optional: true
- extendedWaitUntil:
    visible:
      id: "location-verifier-verified"
    timeout: 30000
- tapOn:
    id: "location-verifier-checkin"
- extendedWaitUntil:
    visible:
      id: "match-checkin-modal"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "match-checkin-report-no-show"
    timeout: 15000
- assertVisible: ".*Your opponent has arrived.*"
- assertVisible:
    id: "match-checkin-opponent-arrived"
- assertVisible: ".*You can't report a no-show because your opponent has arrived at.*"
- assertNotVisible: ".*Can.t check in. Report a no-show.*"
