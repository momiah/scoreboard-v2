appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-home-court-flow-change-used"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Home Court Ladder on Summary.*"
    timeout: 15000
- tapOn: ".*open Maestro Home Court Ladder on Summary.*"
- scrollUntilVisible:
    element:
      id: "ladder-home-court"
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible:
    id: "ladder-home-court-card"
- assertVisible:
    id: "ladder-home-court-name"
    text: "Maestro Court D Verified"
- assertNotVisible:
    id: "ladder-home-court-change"
- assertNotVisible:
    id: "ladder-home-court-add"
