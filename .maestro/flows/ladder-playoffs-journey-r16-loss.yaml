appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/journey-advance.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "r16-leg2-loss"
      TIE: "r1-s1"
      CARD: "playoff-match-leg2"
      MATCH: "r1-s1-leg2"
      GAME: "g6"
      NOTIFICATION: ".*knocked out in the Round of 16 of Maestro Playoffs 256\\..*"
- assertNotVisible: ".*awarded.*"
- runFlow:
    file: ../utilities/playoffs/journey-advance.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      SEED: "r16-leg2-loss"
      TIE: "r1-s1"
      CARD: "playoff-match-leg2"
      MATCH: "r1-s1-leg2"
      GAME: "g6"
      NOTIFICATION: ".*knocked out in the Round of 16 of Maestro Playoffs 256 \\(Paid\\)\\..*"
- assertNotVisible: ".*awarded.*"
