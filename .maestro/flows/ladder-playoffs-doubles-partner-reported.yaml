appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-journey-doubles-r16-leg1-partner-reported"
- runFlow:
    file: ../utilities/playoffs/open-tie-from-notification.yaml
    env:
      NOTIFICATION: ".*made the playoffs for Maestro Playoffs Doubles 256.*"
      TIE: "r1-s1"
- tapOn:
    id: "playoff-match-leg1"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "ladder-game-r1-s1-leg1-g6"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "ladder-game-r1-s1-leg1-g6"
- extendedWaitUntil:
    visible: ".*Maestro Playoffs Doubles 256.*"
    timeout: 15000
- waitForAnimationToEnd
- assertNotVisible:
    id: "game-screen-approval"
