appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-join-singles-status-closed"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 60000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Join Singles on Summary.*"
    timeout: 15000
- tapOn: ".*open Maestro Join Singles on Summary.*"
- scrollUntilVisible:
    element:
      id: "ladder-summary-join"
    direction: DOWN
- assertVisible: "Registration Closed"
- tapOn:
    id: "ladder-summary-join"
- assertNotVisible:
    id: "join-ladder-modal"
