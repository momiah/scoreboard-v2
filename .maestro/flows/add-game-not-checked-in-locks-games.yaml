appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-add-game-flow-not-checked-in"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 60000
- tapOn: "OK"

- tapOn:
    id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*accepted your ladder match.*"
    timeout: 15000
- tapOn: ".*accepted your ladder match.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-add-game-flow-match"
    timeout: 15000
- tapOn:
    id: "schedule-card-maestro-add-game-flow-match"
- assertVisible:
    id: "lobby-games-locked"
- scrollUntilVisible:
    element:
      id: "ladder-game-maestro-add-game-flow-match-g1"
    direction: DOWN
- tapOn:
    id: "ladder-game-maestro-add-game-flow-match-g1"
- extendedWaitUntil:
    visible: "All players must check in to start the games"
    timeout: 10000
- assertNotVisible:
    id: "add-game-score-input"
