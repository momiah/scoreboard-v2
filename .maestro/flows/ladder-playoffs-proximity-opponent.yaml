appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-ladder-playoffs-generated"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 60000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Playoffs 2048 on Playoffs.*"
    timeout: 20000
- tapOn: ".*open Maestro Playoffs 2048 on Playoffs.*"
- extendedWaitUntil:
    visible:
      id: "ladder-playoffs-bracket"
    timeout: 40000
- assertVisible:
    id: "bracket-game-r1-s8"
- assertVisible: ".*P0008 S.*"
- tapOn:
    id: "bracket-view-list"
- scrollUntilVisible:
    element:
      id: "bracket-game-r1-s9"
    direction: DOWN
    timeout: 60000
- assertVisible: ".*P0016 S.*"
- assertVisible: ".*P0024 S.*"
