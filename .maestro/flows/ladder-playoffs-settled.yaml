appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-playoff-match-settled"
- runFlow:
    file: ../utilities/playoffs/open-tie-from-notification.yaml
    env:
      NOTIFICATION: ".*Your Quarter-Final against .* is ready! You have ${MAESTRO_PLAYOFF_TIE_DAYS} days to complete both matches.*"
      TIE: "r2-s0"
- assertVisible: ".*Quarter-Final · Tie.*"
- tapOn:
    id: "playoff-match-back"
- runFlow:
    file: ../utilities/playoffs/open-playoffs-tab.yaml
    env:
      NOTIFICATION: ".*open Maestro Playoffs 256 on Playoffs.*"
- tapOn: "Round of 16"
- runFlow:
    file: ../utilities/playoffs/open-bracket-tie.yaml
    env:
      TIE: "r1-s1"
      SCROLL: "no"
- assertVisible:
    id: "playoff-match-outcome"
- assertVisible: "Winner"
- assertVisible: "Through to the Quarter-Final"
- assertVisible: "Finished"
- assertVisible:
    id: "playoff-match-aggregate"
