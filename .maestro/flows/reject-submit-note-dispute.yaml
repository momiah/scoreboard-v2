appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
# Scenario 2.2 (docs/testing/reject-game-flow-test-plan.md): opener submits a
# note-only dispute -> the game shows the Disputed pill (and is dimmed — not
# asserted directly, styled visual state), and the timeline shows the
# "Dispute opened" phase.
#
# Re-seeds first (see reject-decline-opens-dispute.yaml for why), then walks
# Decline -> compose -> submit before checking the result.
- tapOn:
    id: "maestro-seed-reject-game-flow"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 15000
- tapOn: "OK"

- tapOn:
    id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*Maestro Reject-Flow Ladder.*"
    timeout: 15000
- tapOn: ".*Maestro Reject-Flow Ladder.*"
- assertVisible:
    id: "game-approval-modal"
- tapOn:
    id: "game-approval-decline"

- assertVisible:
    id: "game-dispute-screen"

# A corrected score is required before the dispute can be submitted, even for
# a note-only dispute (createDispute rejects without one) — enter one that
# differs from the original 21-15.
- tapOn:
    id: "dispute-corrected-result"
- tapOn:
    id: "add-game-score-input"
- inputText: "2119"
- tapOn:
    id: "add-game-submit"

- scrollUntilVisible:
    element:
      id: "dispute-compose-note-input"
    direction: DOWN
- tapOn:
    id: "dispute-compose-note-input"
# Focusing the note field triggers an animated scroll-to-end (GameDisputeScreen's
# onNoteFocus) — let it settle before typing, or the keystrokes can land while
# the view is still moving and get dropped.
- waitForAnimationToEnd:
    timeout: 1000
- inputText: "Maestro E2E test note: score should be reviewed."
- assertVisible: ".*Maestro E2E test note.*"
# hideKeyboard's dismiss gesture is a swipe from the screen center, which at
# this scroll position lands on the (large) "Upload video evidence" card and
# opens it — close it back out before continuing.
- hideKeyboard
- runFlow:
    when:
      visible:
        id: "video-upload-modal-close"
    commands:
      - tapOn:
          id: "video-upload-modal-close"
- scrollUntilVisible:
    element:
      id: "dispute-compose-submit"
    direction: DOWN
- tapOn:
    id: "dispute-compose-submit"
- extendedWaitUntil:
    visible: "Dispute submitted for review"
    timeout: 10000

# The dispute now exists — the composer is replaced by the timeline, opened
# with this note.
- assertVisible: ".*Dispute opened.*"
- assertVisible:
    id: "dispute-view-match"
- tapOn:
    id: "dispute-view-match"

- assertVisible:
    id: "match-details"
# The Disputed pill's testID doesn't surface as its own accessibility element
# on iOS (it gets flattened into its parent), so assert on the pill's text —
# game 1 is the only disputed game on screen, so this is unambiguous.
- assertVisible:
    id: "ladder-game-maestro-reject-flow-match-g1"
# iOS merges the whole card into one accessibility element ("GAME 1 Maestro O
# 21 - 15 Disputed Mohsin M"), so match the pill's text as a substring.
- extendedWaitUntil:
    visible: ".*Disputed.*"
    timeout: 10000
