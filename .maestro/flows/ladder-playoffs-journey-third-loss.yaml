appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: ""
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "third-leg2-loss"
      TIE: "r4-s1"
      MATCH: "r4-s1-leg2"
      PLACED: ".*${output.finished4}.*"
      OPPONENT: "opponent-placed-3rd"
      COMPANION_WINNER: "companion-winner-placed-1st"
      COMPANION_LOSER: "companion-loser-placed-2nd"
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: "-paid"
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      SEED: "third-leg2-loss"
      TIE: "r4-s1"
      MATCH: "r4-s1-leg2"
      PLACED: ".*${output.finished4}.*"
      OPPONENT: "opponent-placed-3rd"
      COMPANION_WINNER: "companion-winner-placed-1st"
      COMPANION_LOSER: "companion-loser-placed-2nd"
