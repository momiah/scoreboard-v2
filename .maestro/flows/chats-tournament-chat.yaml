# Chats list: an opponent messages the tournament's Chat Room. The Chats tab
# lists it under the tournament's name (not "Unknown League") with the message
# and an unread count, and the row opens that tournament on its Chat Room.
# An older message with a numeric avatar (saved before avatars were always
# URLs) renders with the default image instead of crashing Android.
appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/tournaments/seed.yaml
    env:
      SCENARIO: "chatSingles"
- runFlow:
    file: ../utilities/harness.yaml
    env:
      BUTTON: "maestro-rr-opponent-sends-chat"
- copyTextFrom:
    id: "maestro-expected-tournamentId"
- evalScript: ${output.chatId = maestro.copiedText}
- copyTextFrom:
    id: "maestro-expected-text"
- evalScript: ${output.chatText = maestro.copiedText}
- copyTextFrom:
    id: "maestro-expected-legacyText"
- evalScript: ${output.legacyText = maestro.copiedText}
- tapOn:
    id: "tab-chats"
- tapOn:
    id: "tab-chats"
- extendedWaitUntil:
    visible:
      id: "chats-row-${output.chatId}"
    timeout: 20000
- assertVisible:
    id: "chats-row-${output.chatId}"
    text: "${output.tournamentName}.*${output.chatText}.*1"
- assertNotVisible: ".*Unknown League.*"
- tapOn:
    id: "chats-row-${output.chatId}"
- extendedWaitUntil:
    visible:
      id: "chat-room-input"
    timeout: 20000
- assertVisible: ${output.chatText}
- assertVisible: ${output.legacyText}
- assertVisible: ${output.tournamentName}
- tapOn:
    id: "tab-chats"
- extendedWaitUntil:
    visible:
      id: "chats-row-${output.chatId}"
    timeout: 20000
- assertNotVisible:
    id: "chats-row-${output.chatId}"
    text: ".*${output.chatText}.*1"
- tapOn:
    id: "tab-home"
