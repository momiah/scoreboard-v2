appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/seed-stage.yaml
    env:
      STAGE: "leg2OneGame"
- runFlow:
    file: ../utilities/playoffs/open-leg.yaml
    env:
      CARD: "playoff-match-leg2"
- tapOn:
    id: "match-details-burger"
- tapOn:
    id: "match-menu-Extension"
- extendedWaitUntil:
    visible:
      id: "extension-info-modal"
    timeout: 10000
- assertVisible: ".*This tie must be finished by.*"
