appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/harness.yaml
    env:
      BUTTON: "maestro-clubs-reset"
- runFlow:
    file: ../utilities/harness.yaml
    env:
      BUTTON: "maestro-clubs-seed-fixture-club"
- runFlow:
    file: ../utilities/clubs/open-club.yaml
    env:
      CLUB_NAME: "Maestro Olive's Club"

# A non-member sees the club but no admin controls
- assertVisible: "2 MEMBERS"
- assertNotVisible:
    id: "club-settings-button"
- assertNotVisible:
    id: "club-invite-members"
- assertNotVisible: "OWNER"
- tapOn: "Feed"
- assertVisible: ".*Ada joined the club.*"

# The test user asks to join
- tapOn: ".*REQUEST TO JOIN.*"
- extendedWaitUntil:
    visible: ".*REQUEST PENDING.*"
    timeout: 20000

# Olive accepts
- runFlow:
    file: ../utilities/harness.yaml
    env:
      BUTTON: "maestro-clubs-olive-accepts-test-user"
- copyTextFrom:
    id: "maestro-expected-clubMembers"
- assertTrue: ${maestro.copiedText == "3"}
- copyTextFrom:
    id: "maestro-expected-clubPendingRequests"
- assertTrue: ${maestro.copiedText == "0"}
- copyTextFrom:
    id: "maestro-expected-clubJoinedMessage"

# The test user is told; the notice opens the club, where they are a member
- tapOn:
    id: "tab-competitions"
- tapOn:
    id: "competitions-notifications"
- extendedWaitUntil:
    visible: ".*Your request to join Maestro Olive's Club was accepted!.*"
    timeout: 20000
- tapOn: ".*Your request to join Maestro Olive's Club was accepted!.*"
- extendedWaitUntil:
    visible:
      id: "club-member-count"
    timeout: 30000
- assertVisible: "3 MEMBERS"
- assertVisible: ".*PARTICIPANT.*"
- assertNotVisible:
    id: "club-invite-members"
- tapOn: "Feed"
- assertVisible: ".*${maestro.copiedText}.*"

# A member's menu offers only Leave Club
- tapOn:
    id: "club-settings-button"
- extendedWaitUntil:
    visible:
      id: "club-settings-LeaveClub"
    timeout: 10000
- assertNotVisible: ".*Edit Club.*"
- assertNotVisible: ".*Pending Requests.*"
- assertNotVisible: ".*Remove Members.*"
- assertNotVisible: ".*Delete Club.*"

# Leaving takes the test user out of the club and tells Olive
- tapOn:
    id: "club-settings-LeaveClub"
- tapOn: "Leave|LEAVE"
- extendedWaitUntil:
    visible: "2 MEMBERS"
    timeout: 20000
- assertVisible: ".*REQUEST TO JOIN.*"
- assertNotVisible:
    id: "club-settings-button"
- runFlow:
    file: ../utilities/harness.yaml
    env:
      BUTTON: "maestro-clubs-count-left-notices"
- copyTextFrom:
    id: "maestro-expected-clubLeftNotices"
- assertTrue: ${maestro.copiedText == "1"}

- runFlow:
    file: ../utilities/harness.yaml
    env:
      BUTTON: "maestro-clubs-cleanup"
