appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-home-court-flow-set"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 30000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Home Court Ladder on Matchmaking.*"
    timeout: 15000
- tapOn: ".*open Maestro Home Court Ladder on Matchmaking.*"
- extendedWaitUntil:
    visible:
      id: "matchmaking-post-match"
    timeout: 20000
- tapOn:
    id: "matchmaking-post-match"
- extendedWaitUntil:
    visible:
      id: "add-ladder-match-court-selector"
    timeout: 10000
- assertNotVisible:
    id: "home-court-required-modal"
- assertVisible: ".*Select Court.*"
- tapOn:
    id: "add-ladder-match-court-selector"
- extendedWaitUntil:
    visible: ".*Maestro Court B Verified.*"
    timeout: 15000
- assertVisible: ".*Maestro Court B Verified.*"
- assertVisible: ".*Maestro Court D Verified.*"
- assertVisible:
    id: "search-court-awaiting-maestro-hc-court-a-singles"
- assertVisible:
    id: "search-court-awaiting-maestro-hc-court-c-singles"
- assertVisible: ".*Awaiting Verification.*"
- assertNotVisible: ".*Maestro Court H Verified Elsewhere.*"
- assertNotVisible: ".*Maestro Court G Unverified.*"
- assertNotVisible: ".*Maestro Court F Other Ladder Pending.*"
- tapOn:
    id: "search-court-awaiting-maestro-hc-court-c-singles"
- assertNotVisible: "Set home court?"
- assertVisible:
    id: "search-court-add"
- tapOn: ".*Maestro Court D Verified.*"
- extendedWaitUntil:
    visible: ".*Maestro Court D Verified.*"
    timeout: 10000
- assertNotVisible: ".*Select Court.*"
- assertNotVisible:
    id: "add-ladder-match-court-pending"
