appId: com.courtchamp
---
# 17. "Log in" on the sign-up intro opens Login, and signing in lands on Home signed in.
- runFlow: ../utilities/signup/signed-out-home.yaml
- tapOn:
    id: "home-sign-in-link"
- tapOn:
    id: "login-register"
- extendedWaitUntil:
    visible:
      id: "signup-intro-login"
    timeout: 10000
- tapOn:
    id: "signup-intro-login"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 10000
- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_TEST_USER_EMAIL}
- tapOn: "Welcome back"
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_TEST_USER_PASSWORD}
- tapOn: "Welcome back"
- tapOn:
    id: "login-submit"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Hello, .*"
    timeout: 60000
- assertVisible:
    id: "maestro-harness-unlock"
