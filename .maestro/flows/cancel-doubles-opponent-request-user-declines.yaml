appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-disband-accepted-requested-by-opponent"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 30000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Disband Ladder on Schedule.*"
    timeout: 15000
- tapOn: ".*open Maestro Disband Ladder on Schedule.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-disband-match"
    timeout: 20000
- tapOn:
    id: "schedule-card-maestro-disband-match"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "match-cancellation-request"
    timeout: 15000
- tapOn:
    id: "match-cancellation-decline"
- extendedWaitUntil:
    visible: "Cancellation declined"
    timeout: 15000
- assertNotVisible:
    id: "match-cancellation-request"
- tapOn:
    id: "tab-home"
- tapOn:
    id: "maestro-assert-disband-notified-decline"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 15000
- tapOn: "OK"
