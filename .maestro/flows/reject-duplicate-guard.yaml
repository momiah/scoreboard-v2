appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-active-dispute"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 60000
- tapOn: "OK"

- tapOn:
    id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*Maestro Reject-Flow Ladder.*"
    timeout: 15000
- tapOn: ".*Maestro Reject-Flow Ladder.*"
- assertVisible:
    id: "game-approval-modal"

- assertVisible:
    id: "game-approval-accept"
    enabled: false
- assertVisible:
    id: "game-approval-decline"
    enabled: false

- assertVisible:
    id: "game-approval-disputed-link"
- tapOn:
    id: "game-approval-disputed-link"
- assertVisible:
    id: "game-dispute-screen"
- assertVisible: ".*Dispute opened.*"
- assertNotVisible:
    id: "dispute-compose-submit"
