appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-inactivity-warning"
- copyTextFrom:
    id: "maestro-expected-inactivityMessage"
- evalScript: ${output.message = maestro.copiedText}
- copyTextFrom:
    id: "maestro-expected-inactivityRuleFirst"
- evalScript: ${output.ruleFirst = maestro.copiedText}
- copyTextFrom:
    id: "maestro-expected-inactivityRuleLast"
- evalScript: ${output.ruleLast = maestro.copiedText}
- runFlow:
    file: ../utilities/playoffs/open-notifications.yaml
- extendedWaitUntil:
    visible: ".*${output.message}.*"
    timeout: 20000
- tapOn: ".*${output.message}.*"
- extendedWaitUntil:
    visible:
      id: "matchmaking-post-match"
    timeout: 20000
# The Rules explain the removal, with the numbers from courtchamps-shared.
- tapOn:
    id: "ladder-burger"
- tapOn:
    id: "ladder-menu-LadderRules"
- extendedWaitUntil:
    visible: "Ladder Rules"
    timeout: 10000
- scrollUntilVisible:
    element: "Keep your place"
    direction: DOWN
- assertVisible: ".*${output.ruleFirst}.*"
- scrollUntilVisible:
    element: ".*${output.ruleLast}.*"
    direction: DOWN
