appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-reject-game-flow"

- tapOn:
    id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*Maestro Reject-Flow Ladder.*"
    timeout: 15000
- tapOn: ".*Maestro Reject-Flow Ladder.*"

- assertVisible:
    id: "game-approval-modal"
- assertVisible:
    id: "game-approval-decline"
- tapOn:
    id: "game-approval-decline"

- assertVisible:
    id: "game-dispute-screen"
- assertVisible:
    id: "dispute-original-result"
- scrollUntilVisible:
    element:
      id: "dispute-compose-note-input"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "dispute-compose-submit"
    direction: DOWN
- assertVisible:
    id: "dispute-compose-submit"
