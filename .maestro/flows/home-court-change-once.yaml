appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-home-court-flow-set"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 30000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Home Court Ladder on Summary.*"
    timeout: 15000
- tapOn: ".*open Maestro Home Court Ladder on Summary.*"
- extendedWaitUntil:
    visible:
      id: "ladder-home-court"
    timeout: 20000
- assertVisible:
    id: "ladder-home-court-name"
    text: "Maestro Court B Verified"
- assertVisible:
    id: "ladder-home-court-change"
- tapOn:
    id: "ladder-home-court-change"
- extendedWaitUntil:
    visible: ".*Maestro Court B Verified.*"
    timeout: 15000
- tapOn: ".*Maestro Court D Verified.*"
- assertVisible: "Change home court?"
- assertVisible: ".*Change your home court to Maestro Court D Verified. This is your only change for this ladder..*"
- tapOn: "Confirm"
- extendedWaitUntil:
    visible: "Home court saved"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "ladder-home-court-card"
    timeout: 15000
- assertVisible:
    id: "ladder-home-court-name"
    text: "Maestro Court D Verified"
- assertNotVisible:
    id: "ladder-home-court-change"
