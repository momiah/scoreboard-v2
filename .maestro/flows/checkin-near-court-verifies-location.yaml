appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-add-game-flow-checkin-court-coords"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 60000
- tapOn: "OK"
- setLocation:
    latitude: 51.5074
    longitude: -0.1278
- tapOn:
    id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*accepted your ladder match.*"
    timeout: 15000
- tapOn: ".*accepted your ladder match.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-add-game-flow-match"
    timeout: 15000
- tapOn:
    id: "schedule-card-maestro-add-game-flow-match"
- extendedWaitUntil:
    visible: ".*Press here to checkin.*"
    timeout: 15000
- tapOn:
    point: "78%,23%"
- extendedWaitUntil:
    visible:
      id: "location-verifier-verified"
    timeout: 30000
- assertVisible:
    id: "location-verifier-checkin"
- assertNotVisible:
    id: "location-verifier-failed"
