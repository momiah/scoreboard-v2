appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: ""
- runFlow:
    file: ../utilities/playoffs/journey-advance.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "qf-leg2-loss"
      TIE: "r2-s0"
      CARD: "playoff-match-leg2"
      MATCH: "r2-s0-leg2"
      GAME: "g6"
      NOTIFICATION: ".*${output.quarterFinalOut}.*"
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: "-paid"
- runFlow:
    file: ../utilities/playoffs/journey-advance.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      SEED: "qf-leg2-loss"
      TIE: "r2-s0"
      CARD: "playoff-match-leg2"
      MATCH: "r2-s0-leg2"
      GAME: "g6"
      NOTIFICATION: ".*${output.quarterFinalOut}.*"
