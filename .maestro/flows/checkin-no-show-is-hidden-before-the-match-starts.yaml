appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-cancel-accepted-opponent-posted"
- runFlow:
    when:
      platform: iOS
    commands:
      - setLocation:
          latitude: 51.5
          longitude: -0.12
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Cancel Ladder on Schedule.*"
    timeout: 15000
- tapOn: ".*open Maestro Cancel Ladder on Schedule.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-cancel-match"
    timeout: 20000
- tapOn:
    id: "schedule-card-maestro-cancel-match"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*Press here to checkin.*"
    timeout: 15000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "78%,23%"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: ".*Press here to checkin.*"
      - tapOn:
          text: "Turn on"
          optional: true
- extendedWaitUntil:
    visible:
      id: "location-verifier-verified"
    timeout: 30000
- tapOn:
    id: "location-verifier-checkin"
- extendedWaitUntil:
    visible:
      id: "match-checkin-modal"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "match-checkin-grant-permission"
    commands:
      - tapOn:
          id: "match-checkin-grant-permission"
      - runFlow:
          when:
            visible: "OK"
          commands:
            - tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "match-checkin-code-input"
    timeout: 20000
- assertNotVisible:
    id: "match-checkin-report-no-show"
- assertNotVisible: ".*Report no-show in.*"
