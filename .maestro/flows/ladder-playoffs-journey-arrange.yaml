appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: ""
- runFlow:
    file: ../utilities/playoffs/journey-arrange.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      CURRENT_PAYOUT: "${output.roundOf16Secured}"
      NEXT_PAYOUT: "${output.roundOf16Next}"
- runFlow:
    file: ../utilities/playoffs/expected-prizes.yaml
    env:
      SUFFIX: "-paid"
- runFlow:
    file: ../utilities/playoffs/journey-arrange.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      CURRENT_PAYOUT: "${output.roundOf16Secured}"
      NEXT_PAYOUT: "${output.roundOf16Next}"
