appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-ladder-playoffs-upcoming"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 300000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Playoffs 256 on Summary.*"
    timeout: 20000
- tapOn: ".*open Maestro Playoffs 256 on Summary.*"
- extendedWaitUntil:
    visible:
      id: "ladder-summary"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "ladder-playoff-countdown"
    timeout: 30000
- assertVisible: "To Playoffs"
- assertNotVisible:
    id: "ladder-status"
- swipe:
    from:
      id: "ladder-tab-Schedule"
    direction: LEFT
- tapOn:
    id: "ladder-tab-Playoffs"
- extendedWaitUntil:
    visible:
      id: "ladder-playoffs-empty"
    timeout: 30000
- assertVisible: "Playoffs haven't started yet"
- assertVisible: ".*The top 16 players in the ladder qualify.*"
