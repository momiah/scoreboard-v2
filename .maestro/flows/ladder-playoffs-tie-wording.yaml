appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/seed-stage.yaml
    env:
      STAGE: "pending"
      SUFFIX: ""
- runFlow: ../utilities/playoffs/open-tie.yaml
- assertVisible: "Round of 16 · Tie 2"
- tapOn:
    id: "playoff-match-back"
- extendedWaitUntil:
    visible:
      id: "ladder-playoffs-bracket"
    timeout: 20000
- tapOn:
    id: "ladder-burger"
- tapOn:
    id: "ladder-menu-LadderRules"
- scrollUntilVisible:
    element: ".*Each playoff tie is two matches.*"
    direction: DOWN
    timeout: 40000
