appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/seed-stage.yaml
    env:
      STAGE: "leg1PostedAfterDecline"
      SUFFIX: ""
- runFlow:
    file: ../utilities/playoffs/harness.yaml
    env:
      BUTTON: "maestro-mock-po-opponent-arranges-leg1"
- runFlow:
    file: ../utilities/playoffs/open-playoffs-tab.yaml
    env:
      NOTIFICATION: ".*arranged playoff match 1 at.*Open it to accept\\..*"
- runFlow:
    file: ../utilities/playoffs/open-bracket-tie.yaml
    env:
      TIE: "r1-s1"
      SCROLL: "no"
- tapOn:
    id: "playoff-match-leg1"
- extendedWaitUntil:
    visible:
      id: "playoff-match-confirm-request"
    timeout: 15000
- assertVisible: "Your opponent arranged this match. You've used your one decline, so please accept. It's accepted automatically after ${MAESTRO_LADDER_AUTO_ACCEPT_HOURS} hours if you don't reply."
- assertVisible:
    id: "playoff-match-confirm-accept"
- assertNotVisible:
    id: "playoff-match-confirm-decline"
