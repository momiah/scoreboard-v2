appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-chats-typed"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 60000
- tapOn: "OK"
- tapOn:
    id: "tab-chats"
- extendedWaitUntil:
    visible: ".*Chats.*"
    timeout: 15000
- tapOn:
    id: "chats-row-maestro-chat-tournament"
- extendedWaitUntil:
    visible:
      id: "chat-room-input"
    timeout: 20000
- assertVisible: ".*Maestro Chat Tournament.*"
