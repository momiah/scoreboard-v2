appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: ""
      LADDER: "Maestro Playoffs 256"
      SEED: "third-leg2-win"
      TIE: "r4-s1"
      MATCH: "r4-s1-leg2"
      PLACED: ".*you have placed 3rd in Maestro Playoffs 256 and been awarded 1,536 CP\\..*"
      OPPONENT: "opponent-placed-4th"
      COMPANION_WINNER: "companion-winner-placed-1st"
      COMPANION_LOSER: "companion-loser-placed-2nd"
- runFlow:
    file: ../utilities/playoffs/journey-finish-ladder.yaml
    env:
      SUFFIX: "-paid"
      LADDER: "Maestro Playoffs 256 \\(Paid\\)"
      SEED: "third-leg2-win"
      TIE: "r4-s1"
      MATCH: "r4-s1-leg2"
      PLACED: ".*you have placed 3rd in Maestro Playoffs 256 \\(Paid\\) and been awarded £614 and 1,536 CP\\..*"
      OPPONENT: "opponent-placed-4th"
      COMPANION_WINNER: "companion-winner-placed-1st"
      COMPANION_LOSER: "companion-loser-placed-2nd"
