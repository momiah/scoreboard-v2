appId: com.courtchamp
onFlowStart:
  - runFlow: ../login.yaml
---
- tapOn:
    id: "maestro-seed-cancel-accepted"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 30000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*open Maestro Cancel Ladder on Schedule.*"
    timeout: 15000
- tapOn: ".*open Maestro Cancel Ladder on Schedule.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-cancel-match"
    timeout: 20000
- tapOn:
    id: "schedule-card-maestro-cancel-match"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- tapOn:
    id: "match-details-burger"
- tapOn:
    id: "match-menu-CancelMatch"
- extendedWaitUntil:
    visible: "Send Request"
    timeout: 5000
- tapOn: "Send Request"
- extendedWaitUntil:
    visible: "Cancellation request sent"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "match-cancellation-awaiting"
    timeout: 15000
- tapOn:
    id: "tab-home"
- tapOn:
    id: "maestro-assert-cancel-notified-request"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 15000
- tapOn: "OK"
- tapOn:
    id: "tab-home"
- tapOn:
    id: "maestro-mock-cancel-opponent-decline"
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 15000
- tapOn: "OK"
- tapOn:
    id: "tab-competitions"
- runFlow:
    when:
      notVisible:
        id: "competitions-notifications-button"
    commands:
      - tapOn:
          id: "tab-competitions"
- tapOn:
    id: "competitions-notifications-button"
- extendedWaitUntil:
    visible: ".*declined to cancel your ladder match.*"
    timeout: 20000
- tapOn: ".*declined to cancel your ladder match.*"
- extendedWaitUntil:
    visible:
      id: "schedule-card-maestro-cancel-match"
    timeout: 20000
- tapOn:
    id: "schedule-card-maestro-cancel-match"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- assertNotVisible:
    id: "match-cancellation-awaiting"
- assertNotVisible:
    id: "match-cancellation-request"
