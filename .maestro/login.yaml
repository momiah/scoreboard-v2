appId: com.courtchamp
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "maestro-seed-reject-game-flow"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "maestro-seed-reject-game-flow"
    commands:
      - tapOn:
          id: "home-sign-in-link"
      - tapOn:
          id: "login-email-input"
      - inputText: ${MAESTRO_TEST_USER_EMAIL}
      - tapOn:
          id: "login-password-input"
      - inputText: ${MAESTRO_TEST_USER_PASSWORD}
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "maestro-seed-reject-game-flow"
          timeout: 15000
