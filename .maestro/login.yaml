appId: com.courtchamp
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "http://localhost:8090"
    commands:
      - tapOn: "http://localhost:8090"
- extendedWaitUntil:
    visible:
      id: "maestro-harness-unlock"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "maestro-harness-unlock"
    commands:
      - tapOn:
          id: "home-sign-in-link"
      - tapOn:
          id: "login-email-input"
      - inputText: ${MAESTRO_TEST_USER_EMAIL}
      - tapOn:
          id: "login-password-input"
      - inputText: ${MAESTRO_TEST_USER_PASSWORD}
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "maestro-harness-unlock"
          timeout: 60000
- tapOn:
    id: "maestro-harness-unlock"
    repeat: 5
    delay: 150
- extendedWaitUntil:
    visible:
      id: "maestro-cleanup-ladder-test-data"
    timeout: 30000
