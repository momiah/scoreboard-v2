appId: com.courtchamp
---
# Leaves a linked screen: Android's Back, iOS's edge swipe. Home must be under it.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 90%, 50%
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 10000
