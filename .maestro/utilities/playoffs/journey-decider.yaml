appId: com.courtchamp
---
- runFlow:
    file: harness.yaml
    env:
      BUTTON: "maestro-seed-journey${SUFFIX}-r16-leg2-level"
- runFlow:
    file: open-tie-from-notification.yaml
    env:
      NOTIFICATION: ".*made the playoffs for ${LADDER}.*"
      TIE: "r1-s1"
- assertNotVisible:
    id: "playoff-match-decider"
- tapOn:
    id: "playoff-match-leg2"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- runFlow:
    file: approve-last-game.yaml
    env:
      MATCH: "r1-s1-leg2"
      GAME: "g6"
- runFlow:
    file: open-tie-from-notification.yaml
    env:
      NOTIFICATION: ".*You have a deciding game left to play as your matches in the Round of 16 of ${LADDER} resulted in a draw!.*"
      TIE: "r1-s1"
- extendedWaitUntil:
    visible:
      id: "playoff-match-decider"
    timeout: 60000
- assertVisible: "6 - 6"
- assertVisible: "Deciding game"
- assertVisible: "Level on aggregate. One deciding game to play."
- scrollUntilVisible:
    element:
      id: "playoff-match-decider"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "playoff-match-decider"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
- assertNotVisible:
    id: "lobby-games-locked"
- tapOn:
    id: "match-details-burger"
- tapOn:
    id: "match-menu-RescheduleMatch"
- extendedWaitUntil:
    visible:
      id: "reschedule-info-modal"
    timeout: 10000
- tapOn: "Choose a time"
- extendedWaitUntil:
    visible:
      id: "reschedule-match"
    timeout: 10000
- runFlow: ../pick-date.yaml
- tapOn:
    id: "reschedule-match-send"
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 20000
- tapOn:
    id: "match-details-burger"
- assertVisible: ".*Reschedule requested.*"
- runFlow:
    file: harness.yaml
    env:
      BUTTON: "maestro-assert-po${SUFFIX}-opponent-asked-reschedule"
