appId: com.courtchamp
---
- runFlow:
    file: journey-advance.yaml
    env:
      SUFFIX: ${SUFFIX}
      LADDER: ${LADDER}
      SEED: ${SEED}
      TIE: ${TIE}
      CARD: "playoff-match-leg2"
      MATCH: ${MATCH}
      GAME: "g6"
      NOTIFICATION: ${PLACED}
- tapOn: ${PLACED}
- extendedWaitUntil:
    visible:
      id: "ladder-summary"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "ladder-status"
    timeout: 30000
- assertVisible:
    id: "ladder-status"
    text: "Playoffs"
- runFlow:
    file: harness.yaml
    env:
      BUTTON: "maestro-assert-po${SUFFIX}-${OPPONENT}"
- runFlow:
    file: harness.yaml
    env:
      BUTTON: "maestro-mock-po${SUFFIX}-finish-companion-tie"
- runFlow:
    file: harness.yaml
    env:
      BUTTON: "maestro-assert-po${SUFFIX}-${COMPANION_WINNER}"
- runFlow:
    file: harness.yaml
    env:
      BUTTON: "maestro-assert-po${SUFFIX}-${COMPANION_LOSER}"
- runFlow:
    file: harness.yaml
    env:
      BUTTON: "maestro-assert-po${SUFFIX}-ladder-completed"
- runFlow: open-notifications.yaml
- tapOn: ${PLACED}
- extendedWaitUntil:
    visible:
      id: "ladder-status"
    timeout: 40000
- assertVisible:
    id: "ladder-status"
    text: "Completed"
