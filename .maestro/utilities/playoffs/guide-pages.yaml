appId: com.courtchamp
---
- runFlow:
    file: seed-stage.yaml
    env:
      STAGE: "pending"
      SUFFIX: ${SUFFIX}
- runFlow:
    file: open-playoffs-tab.yaml
    env:
      NOTIFICATION: ".*open ${LADDER} on Playoffs.*"
- tapOn:
    id: "ladder-how-to-play"
- extendedWaitUntil:
    visible: "Welcome to the Playoffs"
    timeout: 15000
- assertVisible: "The top 16 players made the cut."
- assertVisible: "Every tie is a knockout. Win and you move on, lose and you're out."
- tapOn:
    id: "how-to-play-next"
- extendedWaitUntil:
    visible: "The Playoffs"
    timeout: 10000
- assertVisible:
    id: "how-to-play-playoff-highlight"
- assertVisible: "Final ladder size"
- assertVisible: ${FOOTNOTE}
- tapOn:
    id: "how-to-play-next"
- extendedWaitUntil:
    visible: "Prize Distribution"
    timeout: 10000
- assertVisible:
    id: "how-to-play-prize-table"
- assertVisible: "Finish"
- assertVisible: "CP each"
- assertVisible: "Champion"
- assertVisible: "Runner-up"
- assertVisible: "3rd place"
- assertVisible: "4th place"
- assertVisible: "Quarter-Final"
- assertVisible: ${CHAMPION_ROW}
- tapOn:
    id: "how-to-play-next"
- extendedWaitUntil:
    visible: "Home and Away"
    timeout: 10000
- assertVisible: "Each tie is two matches, one at each player's home court."
- tapOn:
    id: "how-to-play-next"
- extendedWaitUntil:
    visible: "Arrange Your Home Match"
    timeout: 10000
- tapOn:
    id: "how-to-play-next"
- extendedWaitUntil:
    visible: "Win on Aggregate"
    timeout: 10000
- tapOn:
    id: "how-to-play-next"
- extendedWaitUntil:
    visible: "Ten Days to Finish"
    timeout: 10000
- tapOn:
    id: "how-to-play-next"
- extendedWaitUntil:
    visible: "Winning the Final"
    timeout: 10000
- assertVisible: ".*Read the full rules.*"
