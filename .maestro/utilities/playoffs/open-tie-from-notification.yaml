appId: com.courtchamp
---
- runFlow: open-notifications.yaml
- extendedWaitUntil:
    visible: ${NOTIFICATION}
    timeout: 30000
- tapOn: ${NOTIFICATION}
- extendedWaitUntil:
    visible:
      id: "ladder-playoffs-bracket"
    timeout: 40000
- waitForAnimationToEnd
- tapOn:
    id: "bracket-game-${TIE}"
- extendedWaitUntil:
    visible:
      id: "playoff-match-details"
    timeout: 20000
