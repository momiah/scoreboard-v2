appId: com.courtchamp
---
- tapOn:
    id: "tab-home"
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 8
          commands:
            - swipe:
                start: 50%, 25%
                end: 50%, 85%
                duration: 150
      - scrollUntilVisible:
          element:
            id: ${BUTTON}
          direction: DOWN
          timeout: 60000
          speed: 60
          centerElement: true
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
      true: ${BUTTON.indexOf('doubles') !== -1}
    commands:
      - scrollUntilVisible:
          element:
            id: ${BUTTON}
          direction: DOWN
          timeout: 60000
          speed: 60
      - waitForAnimationToEnd
- tapOn:
    id: ${BUTTON}
- extendedWaitUntil:
    visible: "Seeded"
    timeout: 90000
- tapOn: "OK"
