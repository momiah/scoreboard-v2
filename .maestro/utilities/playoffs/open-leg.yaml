appId: com.courtchamp
---
- runFlow:
    file: open-playoffs-tab.yaml
    env:
      NOTIFICATION: ".*open Maestro Playoffs 256 on Playoffs.*"
- runFlow:
    file: open-bracket-tie.yaml
    env:
      TIE: "r1-s1"
      SCROLL: "no"
- scrollUntilVisible:
    element:
      id: ${CARD}
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: ${CARD}
- extendedWaitUntil:
    visible:
      id: "match-details"
    timeout: 15000
