# From the tournament screen, the test user invites every fixture user in
# output.ids through Invite Players, one per visit (search matches first and
# last names, so it types output.fullNames), and the fixture users accept.
appId: com.courtchamp
---
- evalScript: ${output.inviteKeys = Object.keys(output.ids).filter((k) => k !== 'user'); output.ii = 0}
- repeat:
    while:
      true: ${output.ii < output.inviteKeys.length}
    commands:
      - tapOn: ".*Invite Players.*"
      - tapOn:
          id: "invite-search-input"
      - inputText: ${output.fullNames[output.inviteKeys[output.ii]]}
      - tapOn: ".*@ ${output.ids[output.inviteKeys[output.ii]]}.*"
      - tapOn:
          id: "invite-send"
      - extendedWaitUntil:
          visible: "Players invited successfully!"
          timeout: 60000
      - tapOn:
          text: "(OK|Close|Done)"
      - waitForAnimationToEnd
      - evalScript: ${output.ii = output.ii + 1}
- tapOn:
    id: "tab-home"
- runFlow:
    file: ../harness.yaml
    env:
      BUTTON: "maestro-rr-accept-invites"
