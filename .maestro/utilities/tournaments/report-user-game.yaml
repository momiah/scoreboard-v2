# The test user reports their round ROUND game from the Fixtures tab with the
# score output.exp says the round should end with.
appId: com.courtchamp
---
- evalScript: ${output.game = output.exp.userGames[ROUND]}
- runFlow:
    file: open-tournament.yaml
    env:
      TAB: "Fixtures"
- scrollUntilVisible:
    element:
      id: "fixture-game-${output.game.gameNumber}"
    centerElement: true
- tapOn:
    id: "fixture-game-${output.game.gameNumber}"
- tapOn:
    id: "add-game-score-input"
- inputText: ${output.game.score.replace('-', '')}
- tapOn:
    id: "add-game-submit"
- extendedWaitUntil:
    visible:
      id: "video-upload-modal-close"
    timeout: 30000
- tapOn:
    id: "video-upload-modal-close"
- extendedWaitUntil:
    visible:
      id: "fixture-game-${output.game.gameNumber}-status"
      text: "Pending Approval"
    timeout: 30000
- tapOn:
    id: "tab-home"
