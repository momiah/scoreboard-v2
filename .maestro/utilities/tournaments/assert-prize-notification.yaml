# The test user sees their prize notification with the CP output.exp says
# their placement wins.
appId: com.courtchamp
---
- evalScript: ${output.prize = output.exp.prizes[output.ids.user]}
- runFlow: competitions-list.yaml
- tapOn:
    id: "competitions-notifications"
- scrollUntilVisible:
    element:
      text: ".*placed ${output.prize.place} in ${output.tournamentName} and won ${output.prize.xp} CP!"
    timeout: 30000
- tapOn:
    id: "tab-home"
