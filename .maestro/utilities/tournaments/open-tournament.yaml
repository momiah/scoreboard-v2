# Opens output.tournamentName from the Competitions tab, the way a player
# reaches their own private tournament, on the tab TAB.
appId: com.courtchamp
---
- tapOn:
    id: "tab-competitions"
- tapOn:
    id: "tab-competitions"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "competition-item-${output.tournamentName}"
    timeout: 30000
- tapOn:
    id: "competition-item-${output.tournamentName}"
- extendedWaitUntil:
    visible: "Chat Room"
    timeout: 30000
- repeat:
    times: 4
    while:
      notVisible: ${TAB}
    commands:
      - swipe:
          from:
            id: "tournament-tabs"
          direction: LEFT
          duration: 400
- tapOn: ${TAB}
- waitForAnimationToEnd
