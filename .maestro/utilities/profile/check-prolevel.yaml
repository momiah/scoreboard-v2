appId: com.courtchamp
---
- runFlow:
    file: ../playoffs/harness.yaml
    env:
      BUTTON: "maestro-seed-prolevel-${LEVEL}"
- tapOn:
    id: "tab-profile"
- tapOn:
    id: "profile-refresh"
- extendedWaitUntil:
    visible:
      id: "profile-cp"
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${LEVEL == 0}
    commands:
      - assertNotVisible: "PROLevel.*"
      - assertNotVisible:
          id: "profile-prolevel-bar-1-on"
- runFlow:
    when:
      true: ${LEVEL > 0}
    commands:
      - assertVisible:
          id: "profile-prolevel-level-${LEVEL}"
      - assertVisible: "PROLevel ${LEVEL} of 5"
      - assertVisible:
          id: "profile-prolevel-bar-${LEVEL}-on"
- runFlow:
    when:
      true: ${LEVEL > 0 && LEVEL < 5}
    commands:
      - assertVisible:
          id: "profile-prolevel-bar-${Number(LEVEL) + 1}-off"
